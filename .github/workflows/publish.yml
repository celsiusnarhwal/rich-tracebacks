on:
  release:
    types:
      - published

  workflow_dispatch:


jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Build Package
        run: uv build

      - name: Publish Package
        run: uv publish